services:
  oauth-db:
    image: postgres:16
    container_name: postgres
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Europe/Moscow
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  oauth-app:
    build: oauth-server
    image: oauth-server
    container_name: oauth-app
    expose:
      - "9090"
    ports:
      - "9090:9090"
    depends_on:
      - oauth-db
    environment:
      - SERVER_PORT=9090
      - SPRING_DATASOURCE_URL=jdbc:postgresql://oauth-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - LOGGING_LEVEL_RU_PRACTICUM=DEBUG
      - TZ=Europe/Moscow

  rs-app:
    build: rs-server
    image: rs-server
    container_name: rs-app
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      oauth-app:
        condition: service_started
    environment:
      - SERVER_PORT=8080
      - OAUTH_SERVER_ADDRESS=http://localhost:9090
      - TZ=Europe/Moscow